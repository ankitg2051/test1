          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/prod'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'prod.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/prod'
            environmentServiceNameAzureRM: 'azure-service-connection-new'

      - job: Prod_approval
        dependsOn: Prod_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: prod validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: Prod_apply
        dependsOn: Prod_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/prod'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'prod.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/prod'
            environmentServiceNameAzureRM: 'azure-service-connection-new'
        - task: TerraformTask@5
          displayName: prod terraform apply 
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/prod'
            commandOptions: '--auto-approve'
            environmentServiceNameAzureRM: 'azure-service-connection-new'
