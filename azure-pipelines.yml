trigger:
- main

pool: sep-agent

stages:
  - stage: Dev_stage
    displayName: Dev_stage
    jobs:
      - job: Dev_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            environmentServiceNameAzureRM: 'azure-service-connection-new'

      - job: Dev_approval
        dependsOn: Dev_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: dev validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: Dev_apply
        dependsOn: Dev_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            environmentServiceNameAzureRM: 'azure-service-connection-new'
        - task: TerraformTask@5
          displayName: dev terraform apply 
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            commandOptions: '--auto-approve'
            environmentServiceNameAzureRM: 'azure-service-connection-new'

  - stage: QA_stage
    dependsOn: Dev_stage
    condition: succeeded()
    displayName: QA_stage
    jobs:
      - job: QA_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/qa'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'qa.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/qa'
            environmentServiceNameAzureRM: 'azure-service-connection-new'

      - job: QA_approval
        dependsOn: QA_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: qa validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: QA_apply
        dependsOn: QA_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/qa'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'qa.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/qa'
            environmentServiceNameAzureRM: 'azure-service-connection-new'
        - task: TerraformTask@5
          displayName: qa terraform apply 
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/qa'
            commandOptions: '--auto-approve'
            environmentServiceNameAzureRM: 'azure-service-connection-new'

  - stage: Prod_stage
    dependsOn: QA_Stage
    condition: succeeded()
    displayName: Pord_stage
    jobs:
      - job: Prod_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
