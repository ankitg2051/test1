
trigger:
- main

pool: sep-agent

variables:
  ServiceConnection: 'azure-service-connection-new'
  StorageAccount: 'commonstgoct2026'
  Container: 'contstore'

stages:
- stage: Dev_stage
  displayName: Dev_stage
  variables:
    DevEnv: '$(System.DefaultWorkingDirectory)/env/dev'

  jobs:
  - job: Dev_plan
    steps:
    - template: templates/terraform-plan.yml
      parameters:
        workingDirectory: '$(DevEnv)'
        backendKey: 'dev.tfstate'
        serviceConnection: '$(ServiceConnection)'
        storageAccount: '$(StorageAccount)'
        container: '$(Container)'
        artifactName: 'dev-plan'

  - job: Dev_approval
    dependsOn: Dev_plan
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: dev validation
      inputs:
        notifyUsers: 'ankitg.2051@gmail.com'

  - job: Dev_apply
    dependsOn: Dev_approval
    steps:
    - task: TerraformInstaller@1
      displayName: Terraform install
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: terraform init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(DevEnv)'
        backendServiceArm: '$(ServiceConnection)'
        backendAzureRmStorageAccountName: '$(StorageAccount)'
        backendAzureRmContainerName: '$(Container)'
        backendAzureRmKey: 'dev.tfstate'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'dev-plan'
        targetPath: '$(Pipeline.Workspace)/plan-dev'

    - task: TerraformTask@5
      displayName: dev terraform apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(DevEnv)'
        commandOptions: '$(Pipeline.Workspace)/plan-dev/tfplan'
        environmentServiceNameAzureRM: '$(ServiceConnection)'

- stage: QA_stage
  dependsOn: Dev_stage
