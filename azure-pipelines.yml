trigger:
- main

pool: sep-agent

variables:
  ServiceConnection: 'azure-service-connection-new'
  StorageAccount: 'commonstgoct2026'
  Container: 'contstore'
  

stages:
  - stage: Dev_stage
    displayName: Dev_stage
    variables:
      DevEnv: '$(System.DefaultWorkingDirectory)/env/dev'      

    jobs:
      - job: Dev_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(DevEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(DevEnv)'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

      - job: Dev_approval
        dependsOn: Dev_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: dev validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: Dev_apply
        dependsOn: Dev_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(DevEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(DevEnv)'
            environmentServiceNameAzureRM: '$(ServiceConnection)'
        - task: TerraformTask@5
          displayName: dev terraform apply 
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(DevEnv)'
            commandOptions: '--auto-approve'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

  - stage: QA_stage
    dependsOn: Dev_stage
    condition: succeeded()
    displayName: QA_stage
    variables:
      QaEnv: '$(System.DefaultWorkingDirectory)/env/qa'    

    jobs:
