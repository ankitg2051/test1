      displayName: qa validation
      inputs:
        notifyUsers: 'ankitg.2051@gmail.com'

  - job: QA_apply
    dependsOn: QA_approval
    steps:
    - task: TerraformInstaller@1
      displayName: Terraform install
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: terraform init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(QaEnv)'
        backendServiceArm: '$(ServiceConnection)'
        backendAzureRmStorageAccountName: '$(StorageAccount)'
        backendAzureRmContainerName: '$(Container)'
        backendAzureRmKey: 'qa.tfstate'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'qa-plan'
        targetPath: '$(Pipeline.Workspace)/plan-qa'

    - task: TerraformTask@5
      displayName: qa terraform apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(QaEnv)'
        commandOptions: '$(Pipeline.Workspace)/plan-qa/tfplan'
