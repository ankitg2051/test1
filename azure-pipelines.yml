trigger:
- main

pool: sep-agent

variables:
  ServiceConnection: 'azure-service-connection-new'
  StorageAccount: 'commonstgoct2026'
  Container: 'contstore'
  

stages:
  - stage: Dev_stage
    displayName: Dev_stage
    variables:
      DevEnv: '$(System.DefaultWorkingDirectory)/env/dev'      

    jobs:
      - job: Dev_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform install
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(DevEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          displayName: terraform plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(DevEnv)'
            commandOptions: '-out=tfplan'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(DevEnv)/tfplan'
            artifact: 'dev-plan'
            publishLocation: 'pipeline'

      - job: Dev_approval
        dependsOn: Dev_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: dev validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: Dev_apply
        dependsOn: Dev_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(DevEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'dev.tfstate'

        - task: DownloadPipelineArtifact@2
          inputs:
            buildType: 'current'
            artifactName: 'dev-plan'
            targetPath: '$(Pipeline.Workspace)/plan-dev'
        - task: TerraformTask@5
          displayName: dev terraform apply 
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(DevEnv)'
            commandOptions: '$(Pipeline.Workspace)/plan-dev/tfplan'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

  - stage: QA_stage
    dependsOn: Dev_stage
    condition: succeeded()
    displayName: QA_stage
    variables:
      QaEnv: '$(System.DefaultWorkingDirectory)/env/qa'    

    jobs:
      - job: QA_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(QaEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'qa.tfstate'
        - task: TerraformTask@5
          displayName: terraform plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(QaEnv)'
            commandOptions: '-out=tfplan1'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(QaEnv)/tfplan1'
            artifact: 'qa-plan'
            publishLocation: 'pipeline'

      - job: QA_approval
        dependsOn: QA_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: qa validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: QA_apply
        dependsOn: QA_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform install
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(QaEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'qa.tfstate'

        - task: DownloadPipelineArtifact@2
          inputs:
            buildType: 'current'
            artifactName: 'qa-plan'
            targetPath: '$(Pipeline.Workspace)/plan-qa'

        - task: TerraformTask@5
          displayName: qa terraform apply 
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(QaEnv)'
            commandOptions: '$(Pipeline.Workspace)/plan-qa/tfplan1'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

  - stage: Prod_stage
    dependsOn: QA_Stage
    condition: succeeded()
    displayName: Pord_stage
    variables:
      ProdEnv: '$(System.DefaultWorkingDirectory)/env/prod'

    jobs:
      - job: Prod_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform install
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(ProdEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'prod.tfstate'
        - task: TerraformTask@5
          displayName: terraform plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(ProdEnv)'
            commandOptions: '-out=tfplan2'
            environmentServiceNameAzureRM: '$(ServiceConnection)'

        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(ProdEnv)/tfplan2'
            artifact: 'prod-plan'
            publishLocation: 'pipeline'

      - job: Prod_approval
        dependsOn: Prod_plan
        pool: server
        steps:
          - task: ManualValidation@1
            displayName: prod validation
            inputs:
              notifyUsers: 'ankitg.2051@gmail.com'

      - job: Prod_apply
        dependsOn: Prod_approval
        steps:
        - task: TerraformInstaller@1
          displayName: terraform install
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(ProdEnv)'
            backendServiceArm: '$(ServiceConnection)'
            backendAzureRmStorageAccountName: '$(StorageAccount)'
            backendAzureRmContainerName: '$(Container)'
            backendAzureRmKey: 'prod.tfstate'

        - task: DownloadPipelineArtifact@2
          inputs:
            buildType: 'current'
            artifactName: 'prod-plan'
            targetPath: '$(Pipeline.Workspace)/plan-prod'
        - task: TerraformTask@5
          displayName: prod terraform apply   
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(ProdEnv)'
            commandOptions: '$(Pipeline.Workspace)/plan-prod/tfplan2'
            environmentServiceNameAzureRM: '$(ServiceConnection)'