trigger:
- main

pool: sep-agent

stages:
  - stage: Dev_stage
    displayName: Dev_stage
    jobs:
      - job: Dev_plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform init
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'azure-service-connection-new'
            backendAzureRmStorageAccountName: 'commonstgoct2026'
            backendAzureRmContainerName: 'contstore'
            backendAzureRmKey: 'dev.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            environmentServiceNameAzureRM: 'azure-service-connection-new'