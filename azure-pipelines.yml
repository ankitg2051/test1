
trigger:
- main

pool: sep-agent

variables:
  ServiceConnection: 'azure-service-connection-new'
  StorageAccount: 'commonstgoct2026'
  Container: 'contstore'


stages:


- stage: Security_Scan
  displayName: Gitleaks Secret Scan

  jobs:
  - job: Gitleaks
    displayName: Scan Git History
    steps:
    - checkout: self
      fetchDepth: 0

    # Step 1: Run Gitleaks and generate JSON reports
    - powershell: |
        $ErrorActionPreference = 'Stop'

        $reportDir = "$(Build.ArtifactStagingDirectory)"
        $report = Join-Path $reportDir "gitleaks-report.json"

        New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

        # Ensure a report file exists even if Gitleaks cannot start
        Set-Content -Path $report -Value "[]"

        gitleaks git . `
          --report-format json `
          --report-path "$report" `
          --redact=100 `
          --exit-code=1

        $scanExitCode = $LASTEXITCODE

        Write-Host "Gitleaks exit code: $scanExitCode"
        Write-Host "##vso[task.setvariable variable=GitleaksExitCode]$scanExitCode"

        # Let the report publish before failing the job
        exit 0
      displayName: Run Gitleaks and Generate Report

    # Step 2: Publish report even if the scan found a leak
    - task: PublishPipelineArtifact@1
      displayName: Publish Gitleaks Report
      condition: always()
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'gitleaks-report'
        publishLocation: 'pipeline'

    # Step 3: Fail the job if Gitleaks reported a finding/error
    - powershell: |
        $scanExitCode = "$(GitleaksExitCode)"

        if ($scanExitCode -ne "0") {
          Write-Error "Gitleaks failed or detected a possible secret. Review the report artifact."
          exit 1
        }

        Write-Host "Gitleaks scan passed."
      displayName: Enforce Gitleaks Result
      condition: always()


- stage: Dev_stage
  displayName: Dev_stage
  dependsOn: Security_Scan
  condition: succeeded()
  variables:
    DevEnv: '$(System.DefaultWorkingDirectory)/env/dev'

  jobs:
  - job: Dev_plan
    steps:
    - template: templates/terraform-plan.yml
      parameters:
        workingDirectory: '$(DevEnv)'
        backendKey: 'dev.tfstate'
        serviceConnection: '$(ServiceConnection)'
        storageAccount: '$(StorageAccount)'
        container: '$(Container)'
        artifactName: 'dev-plan'

  - job: Dev_approval
    dependsOn: Dev_plan
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: dev validation
      inputs:
        notifyUsers: 'ankitg.2051@gmail.com'

  - job: Dev_apply
    dependsOn: Dev_approval
    steps:
    - template: templates/terraform-apply.yml
      parameters:
        workingDirectory: '$(DevEnv)'
        backendKey: 'dev.tfstate'
        serviceConnection: '$(ServiceConnection)'
        storageAccount: '$(StorageAccount)'
        container: '$(Container)'
        artifactName: 'dev-plan'
        targetPath: '$(Pipeline.Workspace)/plan-dev'
        envv: 'dev'
        commandOptions: '$(Pipeline.Workspace)/plan-dev/tfplan'

- stage: QA_stage
  dependsOn: Dev_stage
  condition: succeeded()
  displayName: QA_stage
  variables:
    QaEnv: '$(System.DefaultWorkingDirectory)/env/qa'

  jobs:
  - job: QA_plan
    steps:
    - template: templates/terraform-plan.yml
      parameters:
        workingDirectory: '$(QaEnv)'
        backendKey: 'qa.tfstate'
        serviceConnection: '$(ServiceConnection)'
        storageAccount: '$(StorageAccount)'
        container: '$(Container)'
        artifactName: 'qa-plan'

  - job: QA_approval
    dependsOn: QA_plan
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: qa validation
      inputs:
        notifyUsers: 'ankitg.2051@gmail.com'

  - deployment: QA_apply
    displayName: QA apply
    dependsOn: QA_approval
    environment: 'QA'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(QaEnv)'
              backendKey: 'qa.tfstate'
              serviceConnection: '$(ServiceConnection)'
              storageAccount: '$(StorageAccount)'
              container: '$(Container)'
              artifactName: 'qa-plan'
              targetPath: '$(Pipeline.Workspace)/plan-qa'
              envv: 'qa'
              commandOptions: '$(Pipeline.Workspace)/plan-qa/tfplan'

- stage: Prod_stage
  dependsOn: QA_stage
  condition: succeeded()
  displayName: Prod_stage
  variables:
    ProdEnv: '$(System.DefaultWorkingDirectory)/env/prod'

  jobs:
  - job: Prod_plan
    steps:
    - template: templates/terraform-plan.yml
      parameters:
        workingDirectory: '$(ProdEnv)'
        backendKey: 'prod.tfstate'
        serviceConnection: '$(ServiceConnection)'
        storageAccount: '$(StorageAccount)'
        container: '$(Container)'
        artifactName: 'prod-plan'

  - job: Prod_approval
    dependsOn: Prod_plan
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: prod validation
      inputs:
        notifyUsers: 'ankitg.2051@gmail.com'
# added
  - job: Prod_apply
    dependsOn: Prod_approval
    steps:
    - template: templates/terraform-apply.yml
      parameters:
        workingDirectory: '$(ProdEnv)'
        backendKey: 'prod.tfstate'
        serviceConnection: '$(ServiceConnection)'
        storageAccount: '$(StorageAccount)'
        container: '$(Container)'
        artifactName: 'prod-plan'
        targetPath: '$(Pipeline.Workspace)/plan-prod'
        envv: 'prod'
        commandOptions: '$(Pipeline.Workspace)/plan-prod/tfplan'
